<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>あと100年で全員佐藤さんになる恋愛ゲーム</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23fff9f0'/%3E%3Cpath d='M12 38c8-17 32-17 40 0v16H12z' fill='%23d84f4f' stroke='%2325201f' stroke-width='4'/%3E%3Ccircle cx='32' cy='28' r='16' fill='%23fff5e7' stroke='%2325201f' stroke-width='4'/%3E%3Ccircle cx='26' cy='28' r='2.5' fill='%2325201f'/%3E%3Ccircle cx='38' cy='28' r='2.5' fill='%2325201f'/%3E%3Cpath d='M25 36c4 4 10 4 14 0' fill='none' stroke='%2325201f' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="game-shell">
      <section class="top-bar" aria-label="ゲーム情報">
        <div class="brand-lockup">
          <img class="brand-logo" src="performance-logo.png" alt="あと100年で日本人は全員佐藤さんになるらしい">
          <div class="brand-copy">
            <p class="kicker">Marry Go Round</p>
            <p class="brand-subtitle">ブラウザ恋愛ゲーム</p>
          </div>
          <h1 class="sr-only" id="gameTitle">あと100年で全員佐藤さんになる恋愛ゲーム</h1>
        </div>
        <button class="icon-button" id="resetButton" type="button" title="最初から">
          <span aria-hidden="true">↺</span>
          <span class="sr-only">最初から</span>
        </button>
      </section>

      <section class="stage" id="stage" aria-live="polite">
        <div class="background-sign">
          <span>婚活相談所</span>
          <strong>Marry Go Round</strong>
        </div>

        <aside class="character-card" id="characterCard">
          <div class="portrait portrait-default" id="portrait" aria-hidden="true">
            <div class="face">
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="mouth"></span>
            </div>
          </div>
          <div class="profile">
            <p class="profile-label" id="profileLabel">攻略対象</p>
            <h2 id="characterName">???</h2>
            <p id="characterTag">相手を選んでください</p>
            <ul id="statsList"></ul>
          </div>
        </aside>

        <section class="dialogue-panel">
          <div class="progress-row">
            <span id="sceneLabel">相談所ロビー</span>
            <span id="scoreLabel">正解 0 / 0</span>
          </div>
          <div class="message-box">
            <p class="speaker" id="speaker">相田</p>
            <p class="message" id="message"></p>
          </div>
          <div class="choices" id="choices"></div>
        </section>
      </section>

      <section class="customize-panel" aria-label="カスタマイズ案内">
        <h2>カスタマイズ</h2>
        <p>
          会話や正解は <code>game-data.js</code> の <code>characters</code> を編集してください。
          攻略対象の追加、質問数の変更、エンディング文の差し替えができます。
        </p>
      </section>
    </main>

    <script src="game-data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
