<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>あと100年で全員佐藤さんになる恋愛ゲーム 乙女デザイン案</title>
    <link rel="stylesheet" href="otome-style.css?v=20261010-standing-art">
    <link rel="stylesheet" href="title-screen.css?v=20261010-title-screen">
  </head>
  <body class="title-active">
    <section class="title-screen" id="titleScreen" aria-label="タイトル画面">
      <img class="title-screen-art" src="title-screen.png?v=20261010" alt="あと100年で日本人は全員佐藤さんになるらしい" width="1240" height="1754" fetchpriority="high">
      <button class="title-start" id="startButton" type="button">ゲームスタート</button>
    </section>
    <main class="game-shell" id="gameShell" hidden>
      <section class="top-bar" aria-label="ゲーム情報">
        <a class="classic-link" href="index.html">通常版</a>
        <div class="brand-lockup">
          <a class="brand-logo-link" href="https://gekidannoro.wixstudio.com/shidaisai2026" target="_blank" rel="noopener noreferrer" aria-label="公演サイトを開く（新しいタブ）" title="公演サイトを開く（新しいタブ）">
            <img class="brand-logo" src="performance-logo.png" alt="あと100年で日本人は全員佐藤さんになるらしい">
          </a>
          <div class="brand-copy">
            <p class="kicker">名古屋市立大学演劇部劇団鈍-NORO-<br>2026年度市大祭公演</p>
            <button class="brand-title brand-home" id="homeButton" type="button" aria-label="ブラウザ恋愛ゲーム" title="最初の画面に戻る">ブラウザ<wbr>恋愛ゲーム</button>
            <h1 class="sr-only" id="gameTitle">あと100年で全員佐藤さんになる恋愛ゲーム</h1>
          </div>
        </div>
        <button class="icon-button" id="resetButton" type="button" title="最初から">
          <span aria-hidden="true">↺</span>
          <span class="sr-only">最初から</span>
        </button>
      </section>

      <section class="stage" id="stage" aria-live="polite">
        <div class="background-sign">
          <span>private salon</span>
          <strong>Marry Go Round</strong>
        </div>

        <aside class="character-card" id="characterCard">
          <div class="portrait portrait-default" id="portrait" aria-hidden="true">
            <div class="face">
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="mouth"></span>
            </div>
          </div>
          <div class="profile">
            <p class="profile-label" id="profileLabel">攻略対象</p>
            <h2 id="characterName">???</h2>
            <p id="characterTag">相手を選んでください</p>
            <ul id="statsList"></ul>
          </div>
        </aside>

        <section class="dialogue-panel">
          <div class="progress-row">
            <span id="sceneLabel">相談所ロビー</span>
            <span id="scoreLabel">正解 0 / 0</span>
          </div>
          <div class="message-box">
            <p class="speaker" id="speaker">相田</p>
            <p class="message" id="message"></p>
          </div>
          <div class="choices" id="choices"></div>
        </section>
      </section>

    </main>

    <script src="game-data.js?v=20261010-standing-art"></script>
    <script src="app.js?v=20261010-title-screen"></script>
  </body>
</html>
